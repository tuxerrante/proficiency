name: Prepare release draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version tag to prepare, for example v0.2.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Validate release version
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use vMAJOR.MINOR.PATCH format" >&2
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists without a release" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test release source
        run: go test -race ./...

      - name: Build release archives
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            asset="proficiency_${VERSION}_${GOOS}_${GOARCH}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags="-s -w -X main.Version=${VERSION}" \
              -o "dist/proficiency" ./cmd/proficiency
            tar -C dist -czf "dist/${asset}.tar.gz" proficiency
            rm dist/proficiency
          done
          (cd dist && sha256sum proficiency_*.tar.gz > checksums.txt)

      - name: Create editable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" dist/* \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes
          echo "Draft release prepared: ${{ github.server_url }}/${{ github.repository }}/releases" \
            >> "$GITHUB_STEP_SUMMARY"
